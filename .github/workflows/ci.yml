name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo "## Coverage"
              echo
              echo "| Metric | Covered |"
              echo "| --- | --- |"
              jq -r '.total | to_entries[] | "| \(.key) | \(.value.pct)% |"' coverage/coverage-summary.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
